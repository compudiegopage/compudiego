<script type="module">
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

const form = document.getElementById("productForm");
const status = document.getElementById("status");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const title = document.getElementById("title").value.trim();
  const short = document.getElementById("short").value.trim();
  const description = document.getElementById("description").value.trim();
  const price = document.getElementById("price").value.trim();
  const imagesRaw = document.getElementById("images").value.trim();
  const images = imagesRaw.split(",").map(url => url.trim()).filter(url => url !== "");

  if(!title || !short || !description || !price) {
    status.style.color = "red";
    status.textContent = "Todos los campos son obligatorios.";
    return;
  }

  try {
    await addDoc(collection(db, "products"), {
      title,
      short,
      description,
      price,
      images,
      createdAt: serverTimestamp()
    });
    status.style.color = "green";
    status.textContent = "Producto guardado correctamente!";
    form.reset();
  } catch(err) {
    console.error(err);
    status.style.color = "red";
    status.textContent = "Error al guardar el producto.";
  }
});
</script>
